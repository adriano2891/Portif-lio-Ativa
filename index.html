    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Landing Page de Vídeo",
        "description": "Reprodução de vídeo em destaque"
      }
    </script>
    <script>
      // Garante compatibilidade e proteção contra scripts ou polyfills de terceiros que tentem reatribuir window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var descriptor = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                           Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window) || {}, 'fetch');
          if (descriptor && (!descriptor.writable || !descriptor.set)) {
            var currentFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Proteção de fetch aplicada com aviso:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-[#090a0f] text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script>
      (function() {
        function removeNetlifyBadge() {
          var selectors = [
            '#netlify-badge',
            '[class*="netlify-badge"]',
            '[id*="netlify-badge"]',
            '#netlify-drawer-container',
            '[data-netlify-drawer]',
            '[data-testid="netlify-badge"]',
            'iframe[src*="netlify"]'
          ];
          selectors.forEach(function(sel) {
            var elements = document.querySelectorAll(sel);
            elements.forEach(function(el) {
              el.style.display = 'none';
              el.style.visibility = 'hidden';
              el.style.opacity = '0';
              el.style.pointerEvents = 'none';
              if (el.parentNode) {
                try { el.parentNode.removeChild(el); } catch(e) {}
              }
            });
          });
        }
        removeNetlifyBadge();
        if (typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(removeNetlifyBadge);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
